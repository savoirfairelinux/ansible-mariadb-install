# Password for mariadb's root account. mandatory.
# mariadb_root_password: undefined

mariadb_packages:
  - mariadb-server
  - python3-mysqldb # for ansible to connect
  - mariadb-client # mariadb client to connect to the database
  - libmysqlclient-dev # needed for mariadb client bindings

# List of user for which we accept outbound connections. A list of usernames
mariadb_accept_outbound_login_for_these_users: []

# SSL Configuration
mariadb_enable_ssl: false
mariadb_ssl_cert_dir: /etc/mysql/ssl
mariadb_ssl_cert_validity_days: 10950  # 30 years
mariadb_require_secure_transport: false  # Set to true to enforce SSL connections
